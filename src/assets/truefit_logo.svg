<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" fill="none" role="img" aria-labelledby="title">
  <title id="title">TrueFit AI</title>
  <defs>
    <linearGradient id="tfMark" x1="20" y1="20" x2="320" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="45%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <filter id="tfGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect x="20" y="20" width="300" height="300" rx="72" fill="url(#tfMark)"/>
  <rect x="22" y="22" width="296" height="296" rx="70" stroke="#fff" stroke-opacity=".15" stroke-width="2" fill="none"/>
  <path d="M100 182 L156 236 L262 104" fill="none" stroke="#fff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(233 78)" filter="url(#tfGlow)">
    <path d="M0 -20 Q0 0 20 0 Q0 0 0 20 Q0 0 -20 0 Q0 0 0 -20 Z" fill="#fff" opacity="0.92"/>
  </g>
  <text x="360" y="225" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="128" font-weight="800" fill="#0f172a" letter-spacing="-2.5">TrueFit</text>
  <g transform="translate(898 124)">
    <rect width="130" height="78" rx="20" fill="url(#tfMark)"/>
    <rect x="2" y="2" width="126" height="74" rx="18" stroke="#fff" stroke-opacity=".25" stroke-width="2" fill="none"/>
    <text x="65" y="53" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" fill="#fff" text-anchor="middle" letter-spacing="2">AI</text>
  </g>
</svg>
